spring.application.name=CrudServiceProject
server.port=8081

# PostgreSQL Configuration
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/exam_2400032964
spring.datasource.username=postgres
spring.datasource.password=root


# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


eureka.instance.appname=crudserviceproject
eureka.client.service-url.defautZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs